<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FF5000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>欢乐购 — 小商品货源批发采购</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 状态栏模拟 -->
    <div class="status-bar">
      <span class="status-time">21:53</span>
      <span class="status-icons">
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".4"/><rect x="4" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".6"/><rect x="8" y="1" width="3" height="11" rx="1" fill="currentColor" opacity=".8"/><rect x="12" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2C5.5 2 3.2 3 1.5 4.7L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2l-1.5 1.5C13.8 3 11.5 2 8 2zm0 4c-1.5 0-2.9.6-3.9 1.6L2.6 6.1C4.1 4.6 6 3.7 8 3.7s3.9.9 5.4 2.4l-1.5 1.5C10.9 6.6 9.5 6 8 6zm0 4c-.8 0-1.5.3-2.1.9L8 12l2.1-2.1C9.5 9.3 8.8 9 8 9z" fill="currentColor"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" fill="none" stroke-width="1"/><rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/><rect x="1.5" y="2.5" width="14" height="7" rx="1" fill="currentColor"/></svg>
      </span>
    </div>

    <!-- 主 Tab 页 Header（多模式：首页搜索 / 分类 / 进货单 / 市场） -->
    <header id="main-header" class="app-header home-header">
      <div id="header-home" class="header-mode active">
        <div class="search-bar" id="open-search">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <span>搜索小商品、店铺、市场</span>
        </div>
        <button type="button" class="header-msg-btn" data-action="toast" data-msg="消息 · 静态演示" aria-label="消息">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
      </div>
      <div id="header-category" class="header-mode tab-title-mode">
        <span class="tab-page-title">全部分类</span>
      </div>
      <div id="header-cart" class="header-mode tab-title-mode">
        <span class="tab-page-title">进货单</span>
        <button type="button" class="header-text-btn" data-action="toast" data-msg="编辑 · 静态演示">编辑</button>
      </div>
      <div id="header-market" class="header-mode tab-title-mode">
        <span class="tab-page-title">义乌市场</span>
        <button type="button" class="header-msg-btn" data-action="toast" data-msg="市场地图 · 静态演示" aria-label="地图">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </button>
      </div>
    </header>

    <!-- 子页 Header（搜索/列表等标准顶栏） -->
    <header id="sub-header" class="app-header sub" style="display:none">
      <button class="back-btn back-btn-minimal" id="back-btn" aria-label="返回">
        <svg class="back-btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="title" id="sub-title">详情</span>
      <button class="header-action" id="sub-action" style="display:none"></button>
    </header>

    <main class="main-content" id="main-content">
      <!-- 首页 -->
      <section id="screen-home" class="screen active">
        <div class="home-notice" id="home-notice">
          <span class="notice-tag">公告</span>
          <div class="notice-scroll"><span>2026春季采购节开启 · 源头好货一件起批 · 实体市场诚信保障</span></div>
        </div>
        <div class="banner-swiper" id="banner-swiper"></div>
        <div class="quick-entry-row" id="quick-entries"></div>
        <div class="category-grid" id="home-categories"></div>
        <div class="promo-strip">
          <div class="promo-card flash" data-action="toast" data-msg="限时秒杀 · 静态演示">
            <div class="promo-label">限时秒杀</div>
            <div class="promo-text">低至 ¥0.1 起</div>
            <div class="promo-img-wrap"><img src="" alt="" class="promo-thumb" id="promo-img-1" loading="lazy" /></div>
          </div>
          <div class="promo-card factory" data-action="toast" data-msg="实力工厂 · 静态演示">
            <div class="promo-label">实力工厂</div>
            <div class="promo-text">源头直供</div>
            <div class="promo-img-wrap"><img src="" alt="" class="promo-thumb" id="promo-img-2" loading="lazy" /></div>
          </div>
        </div>
        <div class="section-title section-title-row">
          <span>猜你喜欢</span>
          <span class="more" data-action="toast" data-msg="换一批 · 静态演示">换一批 ↻</span>
        </div>
        <div class="product-grid" id="home-products"></div>
      </section>

      <!-- 分类 -->
      <section id="screen-category" class="screen">
        <div class="category-layout">
          <nav class="category-sidebar" id="category-sidebar"></nav>
          <div class="category-main" id="category-main"></div>
        </div>
      </section>

      <!-- 市场 -->
      <section id="screen-market" class="screen">
        <div class="market-hero">
          <h2>义乌国际商贸城</h2>
          <p>210000+ 供应商 · 500万+ 在线商品</p>
          <div class="market-hero-stats">
            <div><strong>7</strong><span>大区</span></div>
            <div><strong>5.5万</strong><span>商位</span></div>
            <div><strong>360°</strong><span>看店</span></div>
          </div>
          <button type="button" class="btn-map" data-action="toast" data-msg="市场地图 · 静态演示">查看市场地图</button>
        </div>
        <div class="market-list" id="market-list"></div>
      </section>

      <!-- 购物车 -->
      <section id="screen-cart" class="screen">
        <div class="cart-page" id="cart-page">
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-recommend" id="cart-recommend"></div>
        </div>
        <div class="cart-footer" id="cart-footer"></div>
      </section>

      <!-- 我的 -->
      <section id="screen-profile" class="screen">
        <div id="profile-root"></div>
      </section>

      <!-- 订单列表 -->
      <section id="screen-orders" class="screen">
        <div id="orders-list"></div>
      </section>

      <!-- 搜索 -->
      <section id="screen-search" class="screen">
        <div class="search-page-top">
          <div class="search-input-wrap search-input-lg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input type="search" id="search-input" placeholder="搜索小商品、店铺、市场" />
            <button type="button" class="search-cancel" data-action="back">取消</button>
          </div>
        </div>
        <div class="search-history" id="search-history"></div>
        <div class="hot-keywords">
          <div class="section-title-row"><h4>热门搜索</h4></div>
          <div class="keyword-tags" id="hot-keywords"></div>
        </div>
        <div class="section-title section-title-row"><span id="search-result-label">推荐商品</span></div>
        <div class="product-grid" id="search-results"></div>
      </section>

      <!-- 商品详情 -->
      <section id="screen-detail" class="screen">
        <div id="detail-content"></div>
        <div class="detail-footer" id="detail-footer">
          <div class="footer-icon" data-action="toast" data-msg="客服 · 静态演示">
            <div class="footer-icon-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
            客服
          </div>
          <div class="footer-icon" data-action="nav-shop">
            <div class="footer-icon-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
            店铺
          </div>
          <div class="footer-icon footer-cart" data-action="go-cart">
            <div class="footer-icon-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg></div>
            进货单
            <span class="footer-cart-badge" id="detail-cart-badge">3</span>
          </div>
          <button type="button" class="btn-cart" data-action="open-spec" data-intent="cart">加入进货单</button>
          <button type="button" class="btn-buy" data-action="open-spec" data-intent="buy">立即下单</button>
        </div>
      </section>

      <!-- 店铺 -->
      <section id="screen-shop" class="screen">
        <div id="shop-content"></div>
      </section>

      <!-- 商品列表 -->
      <section id="screen-list" class="screen">
        <div class="filter-bar" id="list-filter-bar">
          <div class="filter-item active" data-filter="default">综合</div>
          <div class="filter-item" data-filter="sales">销量</div>
          <div class="filter-item" data-filter="price">价格 <span class="sort-arrow">↕</span></div>
          <div class="filter-item" data-filter="more">筛选</div>
        </div>
        <div class="product-grid" id="list-products"></div>
      </section>

      <!-- 确认订单 -->
      <section id="screen-checkout" class="screen">
        <div id="checkout-content"></div>
        <div class="checkout-footer" id="checkout-footer"></div>
      </section>
    </main>

    <!-- 底部 Tab -->
    <nav class="tab-bar" id="tab-bar">
      <button class="tab-item active" data-tab="home">
        <div class="tab-item-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>首页</span>
        </div>
      </button>
      <button class="tab-item" data-tab="category">
        <div class="tab-item-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
          <span>分类</span>
        </div>
      </button>
      <button class="tab-item" data-tab="market">
        <div class="tab-item-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span>市场</span>
        </div>
      </button>
      <button class="tab-item" data-tab="cart">
        <div class="tab-item-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
          <span>购物车</span>
          <span class="badge" id="cart-badge">3</span>
        </div>
      </button>
      <button class="tab-item" data-tab="profile">
        <div class="tab-item-wrap">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>我的</span>
        </div>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 详情页滚动吸顶栏（淘宝/京东） -->
  <div id="sticky-detail-bar" class="sticky-detail-bar" aria-hidden="true">
    <button class="back-btn back-btn-minimal sticky-back" data-action="back" aria-label="返回">
      <svg class="back-btn-icon" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="sticky-detail-tabs">
      <button type="button" class="sticky-tab active" data-anchor="section-goods">商品</button>
      <button type="button" class="sticky-tab" data-anchor="section-reviews">评价</button>
      <button type="button" class="sticky-tab" data-anchor="section-detail">详情</button>
    </div>
  </div>

  <!-- 规格 Bottom Sheet（抖音/淘宝） -->
  <div id="sheet-mask" class="sheet-mask hidden">
    <div class="bottom-sheet" id="spec-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <img id="sheet-thumb" src="" alt="" />
        <div class="sheet-price-wrap">
          <div class="sheet-price" id="sheet-price"></div>
          <div class="sheet-stock" id="sheet-stock">库存充足</div>
        </div>
        <button type="button" class="sheet-close" data-action="close-sheet" aria-label="关闭">×</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-footer">
        <button type="button" class="btn-primary sheet-confirm" id="sheet-confirm" data-action="confirm-spec">确定</button>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
