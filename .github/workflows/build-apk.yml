name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'huanlegou-app/**'
      - 'huanlegou-prototype/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huanlegou-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: huanlegou-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web prototype
        run: npm run sync:web

      - name: Build APK on EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Print latest build
        if: success()
        run: |
          echo "## Android APK build finished" >> "$GITHUB_STEP_SUMMARY"
          echo "Download from [Expo Builds](https://expo.dev/accounts/yuanlingqi/projects/huanlegou/builds)" >> "$GITHUB_STEP_SUMMARY"
          npx eas-cli@latest build:list --platform android --limit 1 --non-interactive >> "$GITHUB_STEP_SUMMARY" || true
